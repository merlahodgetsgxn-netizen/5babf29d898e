version: 2.1

jobs:
  gradient_ref:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Generate v1
          command: |
            mkdir -p /tmp/pip
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=20000;i++) printf "{\"line\":%d,\"content\":\"data-%d\"}\n", i, i}' > /tmp/pip/REF_069419; true
            echo "stage ready B"
      - persist_to_workspace:
          root: /tmp/pip
          paths:
            - 'REF_069419'
  jun23-cleanup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pip
      - run:
          name: Preload upstream blob
          command: |
            cat /tmp/pip/REF_069419 2>/dev/null | grep -v '^$' | sort -u | head -5 || true
      - run:
          name: Retrieve sources
          command: git clone --depth 5 --quiet --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack build archive
          command: tar -xf slices-02.tar
      - run:
          command: uptime
      - run:
          name: Finalize build
          command: mkdir -p artifacts
      - run:
          command: ls -la
      - run:
          command: env ./route-prod
  inputRef:
